<section>
   <div class="switch-container">
      <span >User</span>
      <label class="switch">
        <input type="checkbox" id="roleSwitch" [(ngModel)]="member">
        <!-- <span class="slider"></span> -->
      </label>
      <span [(ngModel)]="member">Admin</span>
    </div>
</section>

<!-- Registration Form -->
<section class="form-section">
  
  <form class="register-form">
    
    <div class="input-group">
      <span class="icon">👤</span>
      <input type="text" name="name" [(ngModel)]="registerData.name" placeholder="Full Name" required>
    </div>

    <div class="gender-group">
      <label>Gender</label>
      <div class="gender-options" >
        <label><input type="radio" name="gender"  value="male" [(ngModel)]="registerData.gender"> Male</label>
        <label><input type="radio" name="gender" value="female" [(ngModel)]="registerData.gender"> Female</label>
      </div>
    </div>

    <div class="input-group">
      <span class="icon">✉️</span>
      <input type="email" name="email" [(ngModel)]="registerData.email"  placeholder="Email Address" required>
    </div>

    <div class="input-group">
      <span class="icon">🔒</span>
      <input type="password" name="password" [(ngModel)]="registerData.password" placeholder="Password" required>
    </div>

    <div class="input-group">
      <span class="icon">📞</span>
      <input type="tel" name="mobilenumber" [(ngModel)]="registerData.mobilenumber" placeholder="Mobile Number" required>
    </div>

    <button class="register-btn" (click)="register()">Register</button>

    <p class="login-text">
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>

  </form>
</section>

</body>
</html>
