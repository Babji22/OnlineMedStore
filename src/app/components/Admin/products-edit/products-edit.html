<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Product</title>
</head>
<body>



<!-- Overlay -->
<div class="overlay">

  <!-- Modal -->
  <div class="modal">

    <!-- Header -->
    <div class="modal-header">
      <h2>Edit Product</h2>
      <span class="close">✕</span>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Left Image -->
      <div class="image-section">
        <img src="assets/images/product.png" alt="Product">
        <button class="change-img">Change Image</button>
      </div>

      <!-- Form -->
      <form class="form-section">

        <label>Product Name</label>
        <input type="text" [(ngModel)]="product.name" name="productName">

        <label>ID</label>
        <input type="text" [(ngModel)]="product.id" name="productId" readonly>

        <label>Category</label>
        <select>
          <option>Medicines</option>
          <option>Health Care</option>
          <option>Supplements</option>
        </select>

        <label>Stock</label>
        <select>
          <option>In Stock</option>
          <option>Low Stock</option>
          <option>Out of Stock</option>
        </select>

        <label>Quantity</label>
        <input type="number" [(ngModel)]="product.quantity" name="productQuantity">

        <label>Price</label>
        <input type="number" [(ngModel)]="product.price" name="productPrice">

        <!-- Buttons -->
        <div class="actions">
          <button type="button" class="cancel" (click)="close()">Cancel</button>
          <button type="submit" class="save" (click)="updateProduct()">Save Changes</button>
        </div>

      </form>

    </div>

  </div>

</div>

</body>
</html>
