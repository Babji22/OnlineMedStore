<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard</title>
</head>
<body>


  <!-- Main Content -->
  <main class="main">

    <!-- Header -->
    <header class="topbar">
      <div>
        <h1>Welcome back, {{getUserDetails.name}}!</h1>
        <p class="subtitle">Here’s what’s happening with your account.</p>
      </div>
      <div class="icons">🔔 🔔 👤</div>
    </header>

    <!-- Overview -->
    <section class="overview">
      <div class="card blue">
        <p>Wallet Balance</p>
        <h2>$1,250.50</h2>
      </div>

      <div class="card purple">
        <p>Pending Orders</p>
        <h2>3</h2>
      </div>

      <div class="card orange">
        <p>Items in Cart</p>
        <h2>5</h2>
      </div>

      <div class="card green">
        <p>Total Orders</p>
        <h2>12</h2>
      </div>
    </section>

    <!-- Offers -->
    <section class="offers">

      <!-- Pro Offer -->
      <div class="offer pro">
        <h3>Upgrade to Pro</h3>
        <p>Unlock additional features with our Pro plan.</p>
        <button>Learn More</button>
      </div>

      <!-- Premium Offer -->
      <div class="offer premium">
        <h3>Go Premium!</h3>
        <p>Experience the best with our Premium plan.</p>
        <button>Upgrade</button>
      </div>

    </section>

  </main>

<!-- </div> -->

</body>
</html>
