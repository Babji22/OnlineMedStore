<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Responsive Registration Form | CodingLab </title>
  <link rel="stylesheet" href="/Register.css">
  <script type="text/javascript" src="./Admin.js" defer></script>
</head>
<body>
  <div class="container">
    <!-- Title section -->
    <div class="title">Registration</div>
    <div class="content">
      <!-- Registration form 
      <div class="category">
        <select name="" id="">
          <option id="Admin" value="Admin">Admin</option>
          <option id="member" value="member">member</option>
        </select>
      </div> -->
      <form action="register" method="POST">
        <div class="gender-details">
          <input type="radio" name="gender" id="dot-4">
          <input type="radio" name="gender" id="dot-5" onclick="member(this.id)">
          <span class="gender-title">Choose Option</span>
       <!--  <div class="category"> -->
        <!-- Submit button -->
          <!-- <label for="dot-4">
            <span class="dot four"></span>
            <span class="gender">Admin</span>
          </label>
  
            <label for="dot-5">
            <span class="dot five"></span>
            <span class="gender">Member</span>
  
          </label>-->
          
          <!-- <select name="" id="">
              <option id="val" value="Admin">Admin</option>
              <option id="val" value="member">member</option>
            </select>
        </div> -->
        <div class="category">
        <select name="val" id="val">
          <option id="Admin" value="Admin" name="val" onclick="sent(value)">Admin</option>
          <option id="member" value="member" name="val" onclick="sent(value)">member</option>
        </select>
	</div>
        <div class="user-details">
          <!-- Input for Full Name -->
          <div class="input-box">
            <span class="details">Name</span>
            <input id="name" type="text" placeholder="Enter your name" name="name" required>
          </div>
          
          <!-- <div class="input-box">
              <span class="details">Last Name</span>
              <input type="text" placeholder="Enter your Last name" required>
          </div>
          -->
          <!-- Input for Email -->
          <div class="input-box">
            <span class="details">Email</span>
            <input id="email" type="text" placeholder="Enter your email" name="email" required>
          </div>
          <!-- Input for Password -->
          <div class="input-box">
            <span class="details">Password</span>
            <input id="password" type="text" placeholder="Enter your password" name="password" required onchange="errorcheck(value)">
          </div>
          <!-- Input for Phone Number -->
          <div class="input-box">
            <span class="details">Phone Number</span>
            <input id="phonenumber" type="text" placeholder="Enter your number" name="mobilenumber" required>
          </div>
          
          
        </div>
        <div class="gender-details">
          <!-- Radio buttons for gender selection -->
          <input type="radio" name="male" id="dot-1" value="male">
          <input type="radio" name="female" id="dot-2">
          <input type="radio" name="other" id="dot-3">
          
          <span class="gender-title">Gender</span>
          <div class="category">
            <!-- Label for Male -->
            <label for="dot-1" id="male" name="male" value="male">
              <span class="dot one" id="male" name="male" value="male"></span>
              <span class="gender" id="male" name="male" value="male">Male</span>
            </label>
            <!-- Label for Female -->
            <label for="dot-2">
              <span class="dot two"></span>
              <span class="gender">Female</span>
            </label>
            <!-- Label for Prefer not to say -->
            <label for="dot-3">
              <span class="dot three"></span>
              <span class="gender">Prefer not to say</span>
            </label>
          </div>
        </div>

        
        <div class="button">
          <input type="submit" value="Register">
        </div>
      </form>
    </div>
  </div>
</body>
</html>
